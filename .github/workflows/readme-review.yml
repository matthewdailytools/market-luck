name: OpenDraw README visual review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/review-readme.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-review-${{ github.run_id }}
          path: test-output/readme-review/
          retention-days: 14
