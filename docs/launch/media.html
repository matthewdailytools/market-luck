<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenDraw — controlled proof walkthrough</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #edf1ff;
        color: #172458;
        font-family:
          "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Microsoft YaHei", Arial,
          sans-serif;
      }
      body {
        background-image: linear-gradient(100deg, #f4f6ff, #e1e8ff);
      }
      button {
        font: inherit;
      }
      code,
      .mono {
        font-family: "DejaVu Sans Mono", Consolas, monospace;
      }
      #film {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background-image:
          linear-gradient(#3d57b508 1px, transparent 1px),
          linear-gradient(90deg, #3d57b508 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .top {
        position: absolute;
        left: 58px;
        right: 58px;
        top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 16px;
        font-weight: 700;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: #ffbd3f;
        border-radius: 50%;
        margin-right: 10px;
        box-shadow: 0 0 0 6px #ffbd3f22;
      }
      .flag {
        color: #4d5d84;
        font-size: 13px;
        font-weight: 500;
      }
      .window {
        position: absolute;
        left: 58px;
        top: 76px;
        width: 1164px;
        height: 500px;
        background: white;
        border: 1px solid #cad4f4;
        border-radius: 18px;
        box-shadow: 0 24px 64px #344e8e1c;
        overflow: hidden;
        transform-origin: center center;
      }
      .chrome {
        height: 43px;
        background: #f7f8ff;
        border-bottom: 1px solid #dde3f4;
        padding: 11px 20px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
      }
      .dots {
        color: #aebad6;
        letter-spacing: 7px;
      }
      .scene {
        padding: 28px 34px;
        height: 457px;
        position: relative;
      }
      .chapter {
        color: #4a61ce;
        font-size: 13px;
        letter-spacing: 1.5px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 46px;
        line-height: 1.25;
        letter-spacing: -1.5px;
      }
      h2 {
        font-size: 28px;
        line-height: 1.4;
      }
      p {
        color: #637199;
      }
      .accent {
        color: #3e58d2;
      }
      .columns {
        display: grid;
        grid-template-columns: 1.02fr 1fr;
        gap: 40px;
      }
      .intro-copy {
        padding-top: 14px;
      }
      .sub {
        font-size: 19px;
        margin-top: 20px;
        line-height: 1.6;
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .chip {
        font-size: 14px;
        padding: 10px 13px;
        border-radius: 9px;
        background: #edf1ff;
        color: #4054a6;
      }
      .proofcard {
        border: 1px solid #e0e6f5;
        border-radius: 12px;
        padding: 15px 18px;
        margin-bottom: 10px;
        background: #fafbff;
      }
      .proofcard label {
        display: block;
        color: #6a789e;
        font-size: 12px;
        margin-bottom: 7px;
      }
      .proofcard code {
        font-size: 13px;
        overflow-wrap: anywhere;
        line-height: 1.6;
      }
      .proofcard strong {
        font-size: 19px;
      }
      .tiny {
        font-size: 12px;
        line-height: 1.6;
        color: #7784a3;
      }
      .success {
        color: #16855e;
      }
      .term {
        border-radius: 12px;
        background: #172347;
        color: #eef3ff;
        height: 348px;
        padding: 20px 24px;
        position: relative;
      }
      .term code {
        display: block;
        font-size: 18px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .prompt {
        color: #9caddf;
      }
      .checkgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px 36px;
        margin-top: 16px;
      }
      .check {
        font-size: 15px;
        line-height: 1.8;
        color: #bfeacf;
      }
      .check i {
        font-style: normal;
        color: #61d6a5;
        margin-right: 8px;
      }
      .out {
        font-size: 13px;
        color: #aabbe7;
        margin-top: 10px;
        line-height: 1.65;
        max-width: 980px;
      }
      .result {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding-top: 12px;
        border-top: 1px solid #7485b640;
        font-size: 14px;
      }
      .ball {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 31px;
        height: 31px;
        background: #e9eeff;
        color: #2946be;
        border-radius: 50%;
        font-weight: 700;
        margin-right: 5px;
      }
      .ball.bonus {
        background: #ffce65;
        color: #5b400c;
      }
      .termhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .key {
        display: inline-block;
        background: #ffffff18;
        border: 1px solid #ffffff40;
        padding: 2px 9px;
        border-radius: 5px;
        color: #d9e4ff;
        font-size: 13px;
      }
      .diff {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .diffbox {
        border: 1px solid #e0e6f5;
        border-radius: 12px;
        padding: 18px;
        background: #f7f9ff;
      }
      .diffbox code {
        display: block;
        font-size: 23px;
        margin-top: 14px;
      }
      .diffbox small {
        color: #7481a4;
      }
      .old {
        color: #287c64;
      }
      .new {
        background: #ffdfdd;
        color: #ab3b40;
        padding: 2px 5px;
        border-radius: 4px;
      }
      .error {
        background: #fff0ef;
        border: 1px solid #edb8b7;
        border-radius: 12px;
        padding: 17px 20px;
        margin-top: 18px;
        color: #9b2937;
      }
      .error strong {
        display: block;
        font-size: 27px;
        margin-bottom: 7px;
      }
      .error code {
        font-size: 17px;
      }
      .error p {
        color: #a05763;
        font-size: 13px;
        margin-top: 10px;
      }
      .limgrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 26px;
      }
      .limit {
        border: 1px solid #e0e6f5;
        border-radius: 12px;
        background: #f7f9ff;
        padding: 24px 20px;
        min-height: 178px;
      }
      .limit span {
        font-size: 13px;
        color: #68789f;
      }
      .limit h3 {
        margin: 15px 0 10px;
        font-size: 23px;
      }
      .limit p {
        font-size: 14px;
        line-height: 1.7;
      }
      .end {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        text-align: center;
      }
      .end h1 {
        font-size: 54px;
      }
      .end .repo {
        font-size: 24px;
        color: #4359b9;
        margin-top: 22px;
      }
      .end .cmd {
        display: inline-block;
        background: #172347;
        color: white;
        border-radius: 10px;
        padding: 16px 24px;
        margin-top: 24px;
        font-size: 20px;
      }
      .caption {
        position: absolute;
        top: 608px;
        left: 110px;
        right: 110px;
        text-align: center;
        background: #ffffffdc;
        border: 1px solid #d7def2;
        border-radius: 14px;
        padding: 12px 20px;
        box-shadow: 0 10px 25px #354f8d08;
      }
      .caption .zh {
        font-size: 25px;
        font-weight: 700;
      }
      .caption .en {
        font-size: 16px;
        color: #64749a;
        margin-top: 5px;
      }
      #actor {
        position: absolute;
        width: 48px;
        height: 48px;
        z-index: 5;
        image-rendering: pixelated;
        pointer-events: none;
        transform-origin: center bottom;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 28px;
        z-index: 6;
        filter: drop-shadow(1px 2px 1px #0004);
        pointer-events: none;
      }
      .progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 4px;
        background: #4863de;
      }
      .stamp {
        position: absolute;
        bottom: 12px;
        right: 58px;
        color: #8090b4;
        font-size: 10px;
      }
      .cover {
        width: 1280px;
        height: 640px;
        padding: 52px 62px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(115deg, #f5f7ff, #e3eaff);
        display: grid;
        grid-template-columns: 1.36fr 1fr;
        gap: 42px;
      }
      .cover .brand {
        font-size: 29px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 31px;
      }
      .cover h1 {
        font-size: 58px;
        line-height: 1.16;
        letter-spacing: -2px;
      }
      .cover .sub {
        font-size: 22px;
        margin-top: 22px;
        max-width: 620px;
      }
      .cover .chips {
        gap: 8px;
        margin-top: 26px;
      }
      .cover .chip {
        font-size: 15px;
        background: #fff9;
        border: 1px solid #d3ddf4;
      }
      .cover .evidence {
        align-self: center;
        margin-top: -12px;
        border: 1px solid #d7dff4;
        border-radius: 18px;
        box-shadow: 0 20px 44px #2c479e12;
        background: #fff;
        padding: 26px;
      }
      .cover .evidence .score {
        font-size: 66px;
        color: #324bc7;
        font-weight: 800;
        line-height: 1.1;
      }
      .cover .evidence p {
        font-size: 16px;
      }
      .cover .row {
        padding: 17px 0;
        border-bottom: 1px solid #e9edfa;
      }
      .cover .row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .cover label {
        font-size: 11px;
        color: #7180a6;
        display: block;
        margin-bottom: 7px;
        letter-spacing: 1px;
      }
      .cover code {
        font-size: 15px;
        line-height: 1.5;
      }
      .coverfooter {
        position: absolute;
        left: 62px;
        right: 62px;
        bottom: 27px;
        display: flex;
        justify-content: space-between;
        color: #647299;
        font-size: 13px;
      }
      .coverfooter strong {
        color: #324bc7;
        font-weight: 600;
      }
      .models {
        padding: 70px;
        display: flex;
        gap: 90px;
        align-items: center;
        height: 100vh;
        background: #edf1ff;
      }
      .model {
        text-align: center;
        font-size: 18px;
      }
      .model svg {
        width: 120px;
        height: 120px;
        display: block;
        margin-bottom: 25px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./media.js"></script>
  </body>
</html>
